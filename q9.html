
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q9 - Multi jQuery Widgets</title>
  <!-- Load jQuery v1.12.4 first (for legacy widgets) -->
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <!-- Save reference to v1 as jQuery1 using noConflict in q9-legacy.js -->
  <script src="q9-legacy.js"></script>
  <!-- Load jQuery v3.6.0 for modern widgets -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q9-modern.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{font-family:Arial;margin:20px}.widget{padding:10px;border:1px solid #eee;margin:8px;border-radius:6px}.active{outline:3px solid #60a5fa}</style>
</head>
<body>
  <header><h1>Multi-jQuery Widgets</h1></header>
  <main>
    <div id="carousel" class="widget">Carousel (v1)</div>
    <div id="notifications" class="widget">Notifications (v3)</div>
    <div id="widgets">
      <div class="widget item">Widget A</div>
      <div class="widget item">Widget B</div>
      <div class="widget item">Widget C</div>
    </div>
  </main>
  <footer><small>Q9 example</small></footer>
</body>
</html>
