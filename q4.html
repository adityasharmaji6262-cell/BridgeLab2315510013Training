
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q4 - Special Offer Banner</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="q4.js"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial;margin:20px}
    .banner{padding:14px;margin-bottom:8px;border-radius:8px;color:#fff}
    .b1{background:#2563eb}
    .b2{background:#0ea5a4}
    .b3{background:#f97316}
    .controls button{margin-right:6px;margin-top:8px}
  </style>
</head>
<body>
  <header><h1>Special Offer Banner</h1></header>
  <main>
    <div id="banners">
      <div class="banner b1">Huge Diwali Sale - Up to 50% off!</div>
      <div class="banner b2">Free shipping for orders over ₹999</div>
      <div class="banner b3">Limited time: Extra 10% on electronics</div>
    </div>
    <div class="controls">
      <button id="hide">Hide</button>
      <button id="show">Show</button>
      <button id="slide">Slide Up/Down</button>
      <button id="fade">Fade In/Out</button>
    </div>
  </main>
  <footer><small>Q4 example</small></footer>
</body>
</html>
